<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <header>
            <p class="subtitle">MEMORY • FOCUS • CHALLENGE</p>
            <h1>Memory <span>Match</span></h1>
            <p class="description">Find all matching characters!</p>
        </header>
<div class="players">

    <div class="player-card active" id="player1Card">
        <small>PLAYER 1</small>
        <strong id="player1Score">0</strong>
        <span>PAIRS</span>
    </div>

    <div class="turn-display">
        <small>TURN</small>
        <strong id="currentPlayer">PLAYER 1</strong>
    </div>

    <div class="player-card" id="player2Card">
        <small>PLAYER 2</small>
        <strong id="player2Score">0</strong>
        <span>PAIRS</span>
    </div>

</div>
        <div class="stats">
            <div class="stat">
                <small>MOVES</small>
                <strong id="moves">0</strong>
            </div>

            <div class="stat">
                <small>PAIRS</small>
                <strong><span id="pairs">0</span> / 12</strong>
            </div>

            <div class="stat">
                <small>TIME</small>
                <strong id="timer">00:00</strong>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <button id="restartBtn">↻ New Game</button>

    </div>

    <div class="win-screen" id="winScreen">
        <div class="win-box">
            <div class="trophy">🏆</div>
            <h2>Congratulations!</h2>
            <p>You found all 12 pairs.</p>

            <div class="final-stats">
                <div>
                    <small>TIME</small>
                    <strong id="finalTime">00:00</strong>
                </div>

                <div>
                    <small>MOVES</small>
                    <strong id="finalMoves">0</strong>
                </div>
            </div>

            <p id="bestScore"></p>

            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
